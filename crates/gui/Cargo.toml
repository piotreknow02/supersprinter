[package]
name = "supersprinter-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "supersprinter-gui"
path = "src/main.rs"

[dependencies]
core = { workspace = true }
clap = { workspace = true }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-kit = "0.9.0"
render = { workspace = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
