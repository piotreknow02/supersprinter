name: Build Release Artifacts

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      deb_revision:
        required: false
        type: string
        default: "1"
      rpm_release:
        required: false
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (e.g. v0.1.0)"
        required: true
        type: string
      version:
        description: "Release version (e.g. 0.1.0). Must match the tag."
        required: true
        type: string
      deb_revision:
        description: "Debian package revision (e.g. 1 for 0.1.0-1)."
        required: true
        default: "1"
        type: string
      rpm_release:
        description: "RPM package release (e.g. 1 for 0.1.0-1)."
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-artifacts-${{ inputs.tag || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WIXTOOLSET_VERSION: 3.14.1.20250415
  CARGO_WIX_VERSION: 0.3.9

jobs:
  prepare:
    name: Normalize release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.norm.outputs.tag }}
      version: ${{ steps.norm.outputs.version }}
      deb_revision: ${{ steps.norm.outputs.deb_revision }}
      rpm_release: ${{ steps.norm.outputs.rpm_release }}
    steps:
      - name: Normalize tag and version
        id: norm
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          INPUT_DEB_REVISION: ${{ inputs.deb_revision }}
          DISPATCH_DEB_REVISION: ${{ github.event.inputs.deb_revision }}
          INPUT_RPM_RELEASE: ${{ inputs.rpm_release }}
          DISPATCH_RPM_RELEASE: ${{ github.event.inputs.rpm_release }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          version="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          deb_revision="${INPUT_DEB_REVISION:-${DISPATCH_DEB_REVISION:-1}}"
          rpm_release="${INPUT_RPM_RELEASE:-${DISPATCH_RPM_RELEASE:-1}}"
          tag="$(echo "$tag" | tr -d '[:space:]')"
          version="$(echo "$version" | tr -d '[:space:]')"
          [ -n "$tag" ] || { echo "::error::Tag is required."; exit 1; }
          [[ "$tag" == v* ]] || tag="v${tag}"
          [ -n "$version" ] || version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "::error::Invalid version '$version' (expected 0.1.0 or 0.1.0-rc.1)."; exit 1; }
          [ "$tag" = "v${version}" ] || {
            echo "::error::Tag '$tag' does not match version '$version'."; exit 1; }
          [[ "$deb_revision" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid deb_revision."; exit 1; }
          [[ "$rpm_release" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid rpm_release."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_revision=$deb_revision" >> "$GITHUB_OUTPUT"
          echo "rpm_release=$rpm_release" >> "$GITHUB_OUTPUT"

  build_linux:
    name: Build Linux artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: x86_64-linux
            arch: x86_64
            runs_on: ubuntu-24.04
          - target_platform: aarch64-linux
            arch: aarch64
            runs_on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm clang pkg-config jq desktop-file-utils \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libclang-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build -p supersprinter-gui --release --locked --bin supersprinter-gui
      - name: Stage payload
        run: scripts/package-linux.sh stage --version "$VERSION"
      - name: Package tarball
        run: scripts/package-linux.sh tarball --version "$VERSION" --arch "$ARCH"
      - name: Package .deb
        run: |
          scripts/package-linux.sh deb --version "$VERSION" --arch "$ARCH" \
            --deb-revision "${{ needs.prepare.outputs.deb_revision }}"
      - name: Package .rpm
        run: |
          scripts/package-linux.sh rpm --version "$VERSION" --arch "$ARCH" \
            --rpm-release "${{ needs.prepare.outputs.rpm_release }}"
      - name: Package AppImage
        run: scripts/package-linux.sh appimage --version "$VERSION" --arch "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-artifacts-${{ matrix.target_platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Build Windows artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: x86_64-windows
            artifact_arch: x64
            runs_on: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - target_platform: aarch64-windows
            artifact_arch: arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install LLVM (libclang for bindgen)
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg-windows
        with:
          arch: ${{ matrix.artifact_arch }}
      # The build must stay native (no --target): cargo does not pass RUSTFLAGS
      # to host artifacts, so with --target the flag below would never reach
      # ffmpeg-sys-next's build script - whose main thread needs a bigger stack
      # than the 1 MB PE default, or bindgen's libclang dies with
      # STATUS_STACK_OVERFLOW (0xc00000fd) while parsing the ffmpeg + Windows
      # SDK headers. Both matrix legs run on their own arch, so host == target.
      - name: Build release binary
        shell: pwsh
        env:
          RUSTFLAGS: "-C link-arg=/STACK:8388608"
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').Line -replace '^host: ', ''
          if ($hostTriple -ne $env:RUST_TARGET) {
            throw "runner host triple '$hostTriple' != RUST_TARGET '$env:RUST_TARGET'; this leg must not cross-compile (see the note above)."
          }
          cargo build -p supersprinter-gui --release --locked --bin supersprinter-gui
      - name: Stage portable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target\release"
          # Packaging renames the crate bin to the product name.
          Copy-Item "$out\supersprinter-gui.exe" "$out\supersprinter.exe" -Force
          # Bundle the FFmpeg DLLs next to the exe (MSI + portable ZIP).
          Copy-Item (Join-Path $env:FFMPEG_DIR "bin\*.dll") $out -Force
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target\release"
          New-Item -ItemType Directory -Path dist\portable -Force | Out-Null
          Copy-Item "$out\supersprinter.exe" dist\portable\ -Force
          Copy-Item "$out\*.dll" dist\portable\ -Force
          Copy-Item LICENSE dist\portable\LICENSE -Force
          $zipName = "supersprinter-v${env:VERSION}-windows-${env:ARTIFACT_ARCH}.zip"
          if (Test-Path "dist\$zipName") { Remove-Item "dist\$zipName" -Force }
          Compress-Archive -Path dist\portable\* -DestinationPath "dist\$zipName"
      - name: Build MSI installer (WiX)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install wixtoolset --version "${env:WIXTOOLSET_VERSION}" --yes --no-progress
          cargo install cargo-wix --version "${env:CARGO_WIX_VERSION}" --locked

          # Chocolatey updates machine-level env vars, but the current pwsh
          # session does not pick them up automatically.
          $wixRoot = [Environment]::GetEnvironmentVariable("WIX", "Machine")
          if ([string]::IsNullOrWhiteSpace($wixRoot)) {
            $candidateRoots = @()
            if (${env:ProgramFiles(x86)}) {
              $candidateRoots += (Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14")
            }
            if ($env:ProgramFiles) {
              $candidateRoots += (Join-Path $env:ProgramFiles "WiX Toolset v3.14")
            }
            $wixRoot = $candidateRoots |
              Where-Object { Test-Path (Join-Path $_ "bin\candle.exe") } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($wixRoot)) {
            throw "Unable to locate the WiX Toolset installation after Chocolatey install."
          }
          $wixBin = $wixRoot
          if (!(Test-Path (Join-Path $wixBin "candle.exe"))) {
            $wixBin = Join-Path $wixRoot "bin"
          }
          if (!(Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset bin directory '$wixBin' does not contain candle.exe."
          }
          $env:WIX = Split-Path $wixBin -Parent
          $env:PATH = "$wixBin;$env:PATH"

          # One WiX component per FFmpeg DLL, generated from what is actually
          # staged next to the exe (no hardcoded DLL names).
          pwsh -File scripts/windows/gen-ffmpeg-wxs.ps1 `
            -BinDir "target\release" -OutFile "ffmpeg-files.wxs"

          $msiName = "supersprinter-v${env:VERSION}-windows-${env:ARTIFACT_ARCH}.msi"
          cargo wix --package supersprinter-gui --profile release `
            --no-build --bin-path "$wixBin" --include ffmpeg-files.wxs `
            --output "dist\$msiName"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-artifacts-${{ matrix.target_platform }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: Build macOS artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: aarch64-darwin
            arch: arm64
            runs_on: macos-latest
          - target_platform: x86_64-darwin
            arch: x86_64
            runs_on: macos-15-intel
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install ffmpeg (build-time; runtime needs brew ffmpeg too)
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - name: Package DMG
        run: scripts/package-macos.sh --version "$VERSION" --arch "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-artifacts-${{ matrix.target_platform }}
          path: dist/release/*.dmg
          if-no-files-found: error
          retention-days: 7

  build_cli:
    name: Build CLI artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: x86_64-linux
            arch: x86_64
            runs_on: ubuntu-24.04
            pkg: linux
          - target_platform: aarch64-linux
            arch: aarch64
            runs_on: ubuntu-24.04-arm
            pkg: linux
          - target_platform: x86_64-windows
            artifact_arch: x64
            runs_on: windows-latest
            rust_target: x86_64-pc-windows-msvc
            pkg: windows
          - target_platform: aarch64-windows
            artifact_arch: arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            pkg: windows
          - target_platform: aarch64-darwin
            arch: arm64
            runs_on: macos-latest
            pkg: macos
          - target_platform: x86_64-darwin
            arch: x86_64
            runs_on: macos-15-intel
            pkg: macos
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      PKG: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm clang pkg-config jq desktop-file-utils \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libclang-dev
      - name: Install LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Set up FFmpeg
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-ffmpeg-windows
        with:
          arch: ${{ matrix.artifact_arch }}
      - name: Install ffmpeg (build-time; runtime needs brew ffmpeg too)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        if: runner.os != 'Windows'
        run: cargo build -p supersprinter-cli --release --locked --bin supersprinter-cli
      # Same as in build_windows: native build (no --target) so RUSTFLAGS
      # reaches ffmpeg-sys-next's build script and its 1 MB main-thread stack
      # gets the bigger PE reserve bindgen's libclang needs.
      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-C link-arg=/STACK:8388608"
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').Line -replace '^host: ', ''
          if ($hostTriple -ne $env:RUST_TARGET) {
            throw "runner host triple '$hostTriple' != RUST_TARGET '$env:RUST_TARGET'; this leg must not cross-compile (see the note in the build_windows job)."
          }
          cargo build -p supersprinter-cli --release --locked --bin supersprinter-cli
      - name: Package CLI archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="supersprinter-cli-v${VERSION}-linux-${ARCH}"
          stage="dist/cli/${root}"
          mkdir -p "$stage" dist/release
          cp target/release/supersprinter-cli "$stage/"
          cp LICENSE "$stage/LICENSE"
          tar -czf "dist/release/${root}.tar.gz" -C dist/cli "$root"
      - name: Package CLI archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="supersprinter-cli-v${VERSION}-macos-${ARCH}"
          stage="dist/cli/${root}"
          mkdir -p "$stage" dist/release
          cp target/release/supersprinter-cli "$stage/"
          cp LICENSE "$stage/LICENSE"
          ditto -c -k --sequesterRsrc "dist/cli/${root}" "dist/release/${root}.zip"
      - name: Package CLI archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "supersprinter-cli-v${env:VERSION}-windows-${env:ARTIFACT_ARCH}"
          $stage = "dist\cli\$root"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path dist\release -Force | Out-Null
          Copy-Item "target\release\supersprinter-cli.exe" $stage -Force
          Copy-Item (Join-Path $env:FFMPEG_DIR "bin\*.dll") $stage -Force
          Copy-Item LICENSE "$stage\LICENSE" -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\release\$root.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-artifacts-${{ matrix.target_platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish_release_assets:
    name: Attach assets and checksums to GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare, build_windows, build_linux, build_macos, build_cli]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release-artifacts-*"
          path: dist/release
          merge-multiple: true
      - name: Assemble release payload
        run: |
          set -euo pipefail
          file_count="$(find dist/release -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          [ "$file_count" -gt 0 ] || { echo "::error::No release artifacts assembled."; exit 1; }
          ls -lah dist/release
      - name: Generate checksums
        run: |
          set -euo pipefail
          pushd dist/release >/dev/null
          md5_file="supersprinter-v${VERSION}-checksums.md5"
          sha_file="supersprinter-v${VERSION}-checksums.sha256"
          find . -maxdepth 1 -type f ! -name "*checksums*" -printf "%P\n" \
            | LC_ALL=C sort > /tmp/release_files.txt
          xargs -I{} md5sum "{}" < /tmp/release_files.txt > "$md5_file"
          xargs -I{} sha256sum "{}" < /tmp/release_files.txt > "$sha_file"
          popd >/dev/null
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Emit release summary
        run: |
          {
            echo "### Built release artifacts"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$VERSION\`"
            echo ""
            echo "Files:"
            ls -1 dist/release | sed 's/^/- \`/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
