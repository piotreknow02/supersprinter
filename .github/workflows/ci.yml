name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libavfilter-dev libavdevice-dev libclang-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libavfilter-dev libavdevice-dev libclang-dev
      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          # libclang for bindgen (ffmpeg-sys-next); the session does not pick
          # up machine env vars from Chocolatey automatically.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Set up FFmpeg
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/setup-ffmpeg-windows
        with:
          arch: x64
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ffmpeg-sys-next's build script runs bindgen (in-process libclang) on
      # the build script's main thread, which on Windows gets the 1 MB PE
      # default stack; parsing the ffmpeg + Windows SDK headers overflows it
      # (STATUS_STACK_OVERFLOW, 0xc00000fd). /STACK raises the reserve of every
      # exe linked by this step, build scripts included. Requires the build to
      # run WITHOUT --target: cargo only passes RUSTFLAGS to host artifacts
      # (build scripts, proc macros) when no --target is given.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --locked
        env:
          RUSTFLAGS: "-C link-arg=/STACK:8388608"
      - name: Build
        if: matrix.os != 'windows-latest'
        run: cargo build --workspace --locked
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace
